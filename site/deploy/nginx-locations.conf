# AI 新职业雷达。只插入已有 quant.liang111.top 的 HTTPS server 块，继承其 BasicAuth。
location = /careers { return 301 /careers/; }

location = /careers/api/state {
    limit_except GET { deny all; }
    limit_req zone=career_api burst=10 nodelay;
    limit_req_status 429;
    limit_conn career_connections 3;
    proxy_pass http://127.0.0.1:18991/api/state;
    proxy_http_version 1.1;
    proxy_set_header Host quant.liang111.top;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    server_tokens off;
}

location = /careers/api/refresh {
    limit_req zone=career_api burst=10 nodelay;
    limit_req_status 429;
    limit_conn career_connections 3;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:18991/api/refresh;
    proxy_http_version 1.1;
    proxy_set_header Host quant.liang111.top;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 90s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    server_tokens off;
}

location ^~ /careers/ {
    if ($uri ~ "(^|/)\.") { return 404; }
    alias /srv/ai-career-radar/current/public/;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;
    limit_except GET { deny all; }
    limit_req zone=career_page burst=40 nodelay;
    limit_req_status 429;
    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    include /srv/ai-career-radar/current/deploy/security-headers.conf;
    server_tokens off;
}
