# Insert only into the existing HTTPS quant server; inherited BasicAuth remains mandatory.
location = /careers { return 301 /careers/; }
location = /careers/api/radar-refresh {
    limit_req zone=career_api burst=4 nodelay;
    limit_req_status 429;
    limit_conn career_connections 3;
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:18991/api/radar-refresh;
    proxy_set_header Host quant.liang111.top;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 65s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    include /srv/ai-career-radar/current/security-headers.conf;
    server_tokens off;
}
location = /careers/.rsc {
    alias /srv/ai-career-radar/current/public/index.rsc;
    default_type text/x-component;
    limit_except GET { deny all; }
    include /srv/ai-career-radar/current/security-headers.conf;
    server_tokens off;
}
location ^~ /careers/ {
    if ($uri ~ "(^|/)\.") { return 404; }
    alias /srv/ai-career-radar/current/public/;
    index index.html;
    autoindex off;
    try_files $uri $uri/ =404;
    limit_except GET { deny all; }
    limit_req zone=career_page burst=40 nodelay;
    limit_req_status 429;
    gzip_types text/css application/javascript application/json text/x-component;
    include /srv/ai-career-radar/current/security-headers.conf;
    server_tokens off;
}
